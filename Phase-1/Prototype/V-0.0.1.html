<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Bahar — orchard care for Nagpur Mandarin</title>
<meta name="description" content="Bahar — orchard care for Nagpur Mandarin">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--or:#ef8a1f;--or-d:#b85f05;--or-l:#fff1e0;--gr:#2c8a55;--gr-l:#e3f4ea;--bg:#f6f4ef;--card:#fff;--ink:#1f2d36;--mut:#66737c;--line:#e6e1d7;--red:#c8372d;--red-l:#fdeaea;--yel:#9a7000;--yel-l:#fff4cc;--blu:#2a69a8;--blu-l:#e6f0fa;--pur:#7b2ea0;--pur-l:#f4e7fa;--sh:0 2px 12px rgba(30,40,50,.07);--surf:#fff;--track:#eee;--soft:#f0ece4;--neu:#eeeae2;--hi-l:#ffe6d4;--or-b:#f5cf9f;--gr-b:#bfe3cc;--star:#d6d0c4;--cardb:#efebe3;--ax:#88939b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Noto Sans","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #f8cf9d;border-color:var(--or)}
label.f{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:10px 0 4px}
h1{font-size:24px;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:15px;margin:14px 0 8px;color:var(--mut)}
.top{position:sticky;top:0;z-index:20;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 12px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;cursor:pointer}
.logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd08a,var(--or) 55%,var(--or-d));display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);position:relative}
.logo:after{content:"";position:absolute;top:-3px;right:6px;width:10px;height:7px;background:#3d9a4f;border-radius:10px 0 10px 0}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg);white-space:nowrap}
.pill.sim{background:var(--yel-l);color:var(--yel);border:1.5px solid #e9cf6d}
.pill.on{background:var(--gr-l);color:var(--gr)}.pill.off{background:var(--red-l);color:var(--red)}
.pill.pend{background:var(--blu-l);color:var(--blu)}
.langs{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.langs button{padding:4px 9px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mut)}
.langs button.on{background:var(--surf);color:var(--or-d);box-shadow:var(--sh)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.layout{display:flex}
.rail{width:94px;flex:0 0 94px;background:var(--surf);border-right:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:3px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:14px;font-size:12px;font-weight:700;color:var(--mut);position:relative;text-align:center}
.nb .i{font-size:25px;line-height:1.1}
.nb.on{background:var(--or-l);color:var(--or-d)}
.nb .bd{position:absolute;top:3px;right:10px;background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
main{flex:1;padding:18px;max-width:1150px;margin:0 auto;width:100%;padding-bottom:40px;min-width:0}
.bnav{display:none}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:14px;border:1px solid var(--cardb)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:var(--surf);border-radius:22px;box-shadow:var(--sh);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:16px;position:relative;border:2px solid transparent;transition:transform .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--or)}
.tile .i{font-size:44px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center}
.tile .bd{position:absolute;top:10px;right:12px;background:var(--red);color:#fff;font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;background:var(--or);color:#fff;font-size:16px;min-height:48px}
.btn.g{background:#2c8a55}.btn.r{background:#c8372d}.btn.b{background:#2a69a8}
.btn.o{background:var(--surf);color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:12px}
.btn.big{font-size:20px;min-height:64px;padding:14px 26px;border-radius:18px}
.btn.w{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--surf);border:2px solid var(--line);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.chip.on{border-color:var(--or);background:var(--or-l);color:var(--or-d)}
.opt{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.opt button{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.opt button .i{font-size:28px}
.opt button.on{border-color:var(--or);background:var(--or-l)}
.src{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.3px;vertical-align:middle}
.s-SIM{background:var(--surf)4cc;color:#8a6400}.s-USER{background:#e6f0fa;color:#2a69a8}.s-IMG{background:#f4e7fa;color:#7b2ea0}.s-LAB{background:#e3f4ea;color:#2c8a55}.s-EXPERT{background:#1f2d36;color:#fff}.s-PRED{background:#eee;color:#555}
.cat{display:inline-flex;align-items:center;gap:5px;font-weight:800;padding:5px 11px;border-radius:999px;font-size:14px}
.c-LOW{background:var(--gr-l);color:var(--gr)}.c-MODERATE{background:var(--yel-l);color:var(--yel)}.c-HIGH{background:var(--hi-l);color:#b4500e}.c-CRITICAL{background:var(--red-l);color:var(--red)}
.zc{cursor:pointer;border-top:6px solid var(--gr)}
.zc.HIGH{border-top-color:#d9661f}.zc.MODERATE{border-top-color:#d4a200}.zc.CRITICAL{border-top-color:var(--red)}
.zh{display:flex;align-items:center;justify-content:space-between}
.zname{font-size:22px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.st{background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.st .i{font-size:22px}.st b{font-size:17px;display:block}.st small{font-size:11.5px;color:var(--mut);display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:6px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--track)}.chart .ax{font-size:10.5px;fill:var(--ax)}
.rec{border-left:7px solid var(--line)}
.rec.p1{border-left-color:var(--red)}.rec.p2{border-left-color:var(--or)}.rec.p3{border-left-color:var(--blu)}
.pr{font-weight:800;font-size:13px;padding:3px 9px;border-radius:8px;color:#fff}
.pr.p1{background:#c8372d}.pr.p2{background:#d9661f}.pr.p3{background:#2a69a8}
.state{font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px;background:var(--bg);color:var(--mut)}
.evi{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.evi span{background:var(--bg);padding:5px 9px;border-radius:10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;background:var(--bg);padding:8px;font-size:12.5px;color:var(--mut)}
td{padding:8px;border-bottom:1px solid var(--soft);vertical-align:top}
.tw{overflow:auto}
.chk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--gr-l);margin-bottom:6px;font-weight:600}
.chk.x{background:var(--red-l);color:var(--red)}
.ring{width:140px;height:140px}
.banner{padding:12px 14px;border-radius:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.r{background:var(--red-l);color:var(--red)}.banner.y{background:var(--yel-l);color:var(--yel)}.banner.b{background:var(--blu-l);color:var(--blu)}.banner.g{background:var(--gr-l);color:var(--gr)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px dashed #e9c9a0;border-radius:20px;padding:26px 10px;background:var(--or-l);cursor:pointer;font-weight:800;color:var(--or-d);text-align:center}
.drop .i{font-size:48px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.th{background:var(--surf);border-radius:14px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;font-size:12px}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.th div{padding:5px 7px;font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:14px;background:var(--bg);font-size:24px;font-weight:800}
.step input{text-align:center;font-size:20px;font-weight:800}
.bignum{font-size:42px;font-weight:800;line-height:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stars button{font-size:32px;color:var(--star)}.stars button.on{color:#f2a900}
#modal .bg{position:fixed;inset:0;background:rgba(20,28,34,.45);z-index:50;display:grid;place-items:center;padding:16px}
#modal .box{background:var(--surf);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#1f2d36;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.login{max-width:980px;margin:0 auto;padding:22px 16px 40px}
.hero{text-align:center;padding:16px 0 6px}
.hero .logo{width:84px;height:84px;font-size:40px;margin:0 auto 8px}
.hero .logo:after{width:22px;height:14px;top:-6px;right:16px}
.hero h1{justify-content:center;font-size:32px;margin:0}
.demo{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.demo button{background:var(--surf);border-radius:20px;box-shadow:var(--sh);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent}
.demo button:hover{border-color:var(--or)}
.demo .i{font-size:42px}.demo b{font-size:16px}.demo small{color:var(--mut);font-size:12px}
.prog{height:16px;background:var(--blu-l);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#3d8ed8,#5fb3f0);transition:width .25s}
.hl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
@media(max-width:760px){
 .rail{display:none}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);z-index:30;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:2px}
 .bnav .nb{flex:0 0 68px;font-size:11px}
 main{padding:12px;padding-bottom:110px}
 .hs{display:none!important}
 .top{gap:4px;padding:8px}
 .tiles{grid-template-columns:repeat(2,1fr)}
 h1{font-size:21px}
 #toast{bottom:100px}
}

/* ---------- dark theme ---------- */
:root[data-theme="dark"]{color-scheme:dark;--bg:#11171c;--card:#1a2229;--surf:#1a2229;--ink:#e7edf1;--mut:#9aa8b2;--line:#2f3b45;--track:#2c363f;--soft:#26313a;--neu:#26313a;--cardb:#25303a;
 --or:#f0922e;--or-d:#ffb05c;--or-l:#3a2915;--gr:#4cc184;--gr-l:#173327;--red:#ff6b5f;--red-l:#3d1d1c;--yel:#f2c94c;--yel-l:#352c10;--blu:#6aaef0;--blu-l:#162a3d;--pur:#c48ae6;--pur-l:#2d1d3a;
 --hi-l:#3f2614;--or-b:#6b4a22;--gr-b:#2c5a43;--star:#4a5560;--ax:#7d8b95;--sh:0 2px 14px rgba(0,0,0,.35)}
:root[data-theme="dark"] .s-SIM{background:#3a3012;color:#f2c94c}:root[data-theme="dark"] .s-USER{background:#16304a;color:#7cb9f2}:root[data-theme="dark"] .s-IMG{background:#33204a;color:#d09cf0}
:root[data-theme="dark"] .s-LAB{background:#173a2a;color:#5fd197}:root[data-theme="dark"] .s-EXPERT{background:#e7edf1;color:#11171c}:root[data-theme="dark"] .s-PRED{background:#2c363f;color:#c5ced5}
:root[data-theme="dark"] .c-HIGH{color:#ff9d5c}:root[data-theme="dark"] .pill.sim{border-color:#6b5a1c}
:root[data-theme="dark"] .drop{border-color:#6b4a22}:root[data-theme="dark"] .btn.o{background:var(--surf)}
:root[data-theme="dark"] #toast div{background:#e7edf1;color:#11171c}
:root[data-theme="dark"] .logo{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px #2a2016}
body,.card,.top,.rail,.tile,.chip,input,select,textarea{transition:background-color .25s,color .25s,border-color .25s}
/* ---------- theme switch ---------- */
.tgl{position:relative;width:62px;height:34px;border-radius:999px;background:#dfe6ec;flex:0 0 62px;border:2px solid var(--line);padding:0}
.tgl .k{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:grid;place-items:center;font-size:15px;transition:transform .25s}
.tgl .s{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;opacity:.55}.tgl .s.l{left:7px}.tgl .s.r{right:7px}
:root[data-theme="dark"] .tgl{background:#2b3f55}
:root[data-theme="dark"] .tgl .k{transform:translateX(28px);background:#0f1a24}
.tgl:focus-visible{outline:3px solid #f8cf9d;outline-offset:2px}

/* =================== refined finish =================== */
:root{--pri:#1f3b33;--pri-l:#e8efea;--on-pri:#fff;--acc:#c46f1c;--bg:#f7f5f0;--line:#e5e1d8;--ink:#1c2924;--mut:#6b766f;--soft:#f1eee7;
 --serif:"Fraunces","Noto Serif Devanagari",Georgia,serif;--sans:"Inter","Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--pri:#e3b06e;--pri-l:#2b261d;--on-pri:#14191d;--acc:#e3b06e;--soft:#222c34}
html,body{font-family:var(--sans);font-size:15.5px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
h1{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:-.015em;margin:2px 0 18px;gap:12px}
h1 svg.ic{color:var(--acc);width:.85em;height:.85em}
h2{font-size:15px;font-weight:600;letter-spacing:.01em;margin:0 0 12px}
h2 svg.ic{color:var(--mut)}
h3{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:20px 0 12px}
.wm{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
.top{height:60px;padding:8px 18px;box-shadow:none}
.brand{font-size:19px;gap:10px}
.logo{width:30px;height:30px;font-size:0;background:radial-gradient(circle at 38% 34%,#f3b46a,#d97f24 60%,#b0601a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.logo:after{top:-4px;right:5px;width:11px;height:7px;background:#3f7a52;border-radius:10px 0 10px 0}
.hero{padding:30px 0 4px}.hero .logo{width:64px;height:64px;margin-bottom:14px}.hero .logo:after{width:20px;height:12px;top:-7px;right:12px}
.hero h1{font-size:40px;margin:0 0 6px}.hero p{font-size:15px;letter-spacing:.02em}
.pill{font-weight:500;border-radius:8px;padding:6px 10px;font-size:12.5px}
.pill.sim{background:transparent;border:1px solid var(--line);color:var(--mut);letter-spacing:.06em;font-size:11px;font-weight:600}
.pill.sim svg{color:var(--yel)}
.langs{border-radius:9px;padding:3px}.langs button{border-radius:7px;font-weight:600}
.langs button.on{color:var(--ink)}
.ibtn{width:38px;height:38px;border-radius:9px;font-size:18px;color:var(--mut)}
.rail{width:88px;flex-basis:88px;padding:12px 8px;gap:2px;top:60px;height:calc(100vh - 60px)}
.nb{font-weight:500;font-size:11.5px;border-radius:10px;padding:9px 2px 8px;gap:4px}
.nb .i{font-size:20px;line-height:1}
.nb.on{background:var(--pri-l);color:var(--pri)}
.nb.on .i{color:var(--pri)}
.nb .bd,.tile .bd{background:var(--acc);color:#fff;font-weight:600;font-size:10.5px;min-width:17px;height:17px;top:6px}
:root[data-theme="dark"] .nb .bd,:root[data-theme="dark"] .tile .bd{color:#14191d}
.tile .bd{top:12px;right:12px}
main{padding:26px 28px 48px}
.card{border-radius:14px;box-shadow:none;border:1px solid var(--line);padding:18px 20px}
:root[data-theme="dark"] .card{border-color:var(--cardb)}
.tiles{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{border-radius:14px;box-shadow:none;border:1px solid var(--line);padding:22px 12px 18px;font-weight:500;font-size:14.5px;gap:12px}
.tile:hover{transform:none;border-color:var(--pri);background:var(--surf)}
.tile .i{width:52px;height:52px;border-radius:13px;font-size:24px;background:var(--soft)!important;color:var(--pri)}
.btn{border-radius:10px;font-weight:600;font-size:15px;background:var(--pri);color:var(--on-pri);min-height:44px;padding:10px 18px;letter-spacing:.01em}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:#2f6f4e}.btn.r{background:#a83a30}.btn.b{background:#2b5c8c}
.btn.g,.btn.r,.btn.b{color:#fff}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.o:hover{border-color:var(--pri);filter:none}
.btn.big{font-size:16px;min-height:52px;border-radius:12px;padding:12px 24px}
.btn.sm{border-radius:8px}
.chip{border-radius:9px;border-width:1px;font-weight:500;min-height:38px;padding:7px 13px;font-size:13.5px;background:var(--surf)}
.chip.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri);font-weight:600}
.opt{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.opt button{border-width:1px;border-radius:12px;font-weight:500;font-size:12.5px;padding:12px 4px 10px;gap:7px}
.opt button .i{font-size:22px;color:var(--mut)}

/* ---------------------------- simulator (seeded) ---------------------------- */
function simulate(z,sc,seed,days,fault){
 const r=rng((seed|0)*7919+z.idx*104729+17);
 const n=days*24, end=Math.floor(Date.now()/36e5)*36e5, start=end-(n-1)*36e5;
 let v={DRY_SOIL:0.27,EXCESS:0.31,RAIN_AFTER:0.255,HIGH_TEMP:0.27,LOW_RH:0.27}[sc]??0.285;
 const fs=Math.max(0,n-18); let stuck=null;
 const flt=sc==='SENSOR_FAULT'?'stuck':sc==='SUDDEN'?'spike':fault;
 const out=[];
 for(let h=0;h<n;h++){
  const ts=start+h*36e5, hod=new Date(ts).getHours(), dayi=Math.floor(h/24);
  const di=Math.sin((hod-9)/24*2*Math.PI);
  let tm=30,amp=6.5,rhb=60;
  if(sc==='HIGH_TEMP'){tm=37.5;amp=7;rhb=40} if(sc==='LOW_RH'){tm=32;rhb=32} if(sc==='EXCESS'){tm=27;rhb=78}
  const temp=tm+amp*di+(r()-.5)*1.4;
  const rh=clamp(rhb-16*di+(r()-.5)*6,6,98);
  const light=hod>=6&&hod<=18?Math.round(1000*Math.sin(Math.PI*(hod-6)/12)*(.8+.2*r())):0;
  let rain=0;
  if(sc==='NORMAL'&&r()<0.012) rain=2+r()*6;
  if(sc==='EXCESS'&&r()<0.09) rain=4+r()*12;
  let irr=0;
  if(['NORMAL','MISSING','SENSOR_FAULT','SUDDEN'].includes(sc)&&hod===6&&dayi%3===1) irr=16;
  if(['HIGH_TEMP','LOW_RH'].includes(sc)&&hod===6&&dayi%4===2) irr=12;
  if(sc==='EXCESS'&&hod===6&&dayi%2===0) irr=14;
  const etf={HIGH_TEMP:1.35,LOW_RH:1.25,DRY_SOIL:1.1,RAIN_AFTER:1.1,EXCESS:0.7}[sc]||1;
  const et=Math.max(0,temp-10)*0.011*(light>0?1.55:0.2)*etf;
  v+=(rain+irr-et)/(z.root*1000);
  if(v>z.fc) v-=(v-z.fc)*(sc==='EXCESS'?0.012:0.1);
  v=clamp(v,z.wp*0.85,0.47);
  const soilT=26+(temp-26)*0.45+(r()-.5)*.6-(v-0.2)*8;
  let vw=v+(r()-.5)*0.004, T=temp, RH=rh;
  if(h>=fs){
   if(flt==='stuck'){if(stuck==null)stuck=r3(vw);vw=stuck}
   if(flt==='drift') vw+=(h-fs)*0.0009;
   if(flt==='spike'&&h===fs) vw+=0.16;
   if(flt==='dropout'&&r()<0.35) vw=null;
   if(flt==='offline'&&h<fs+10){vw=null;T=null;RH=null}
  }
  if(sc==='MISSING'&&r()<0.18){vw=null;if(r()<.5){T=null;RH=null}}
  out.push({ts,temp:T==null?null:r1(T),rh:RH==null?null:Math.round(RH),rain:r1(rain),irr,light,vwc:vw==null?null:r3(vw),soilT:r1(soilT),q:'OK'});
 }
 flagQuality(out);
 z.readings=out; z.run={sc,seed,days,fault:flt,at:Date.now()}; z.forecastRain=(sc==='RAIN_AFTER');
 return out;
}
function flagQuality(arr){
 let prev=null,run=0,last=null;
 arr.forEach((p,i)=>{
  p.q='OK';
  if(p.vwc==null){p.q='MISSING';return}
  if(p.vwc<0||p.vwc>0.6){p.q='RANGE';return}
  if(prev!=null&&Math.abs(p.vwc-prev)>0.04&&!(p.rain>0||p.irr>0)) p.q='SPIKE';
  if(last!=null&&p.vwc===last){run++;if(run>=6){p.q='STUCK';for(let k=1;k<=run&&i-k>=0;k++)if(arr[i-k].q==='OK')arr[i-k].q='STUCK'}}else run=0;
  last=p.vwc; if(p.q!=='SPIKE') prev=p.vwc;
 });
 // drift: rising soil moisture for 12 h with no rain or irrigation
 for(let i=12;i<arr.length;i++){
  const a=arr[i-12],b=arr[i];if(a.vwc==null||b.vwc==null)continue;
  let wet=false;for(let k=i-12;k<=i;k++)if(arr[k].rain>0||arr[k].irr>0){wet=true;break}
  if(!wet&&b.vwc-a.vwc>0.008&&b.q==='OK') b.q='DRIFT';
 }
}

/* ---------------------------- analysis engines ---------------------------- */
function extraRad(ts){ // Ra (mm/day) for Nagpur, FAO-56 eq. 21
 const d=new Date(ts),J=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),phi=21.15*Math.PI/180;
 const dr=1+0.033*Math.cos(2*Math.PI*J/365),del=0.409*Math.sin(2*Math.PI*J/365-1.39),ws=Math.acos(-Math.tan(phi)*Math.tan(del));
 return 0.408*(24*60/Math.PI)*0.082*dr*(ws*Math.sin(phi)*Math.sin(del)+Math.cos(phi)*Math.cos(del)*Math.sin(ws));
}
function analyse(z){
 const th=S.thr.vals,R=z.readings;if(!R||!R.length)return null;
 const end=R[R.length-1].ts,last=R.filter(p=>p.ts>end-24*36e5);
 const ok=last.filter(p=>p.q==='OK');
 const temps=last.map(p=>p.temp).filter(x=>x!=null),rhs=last.map(p=>p.rh).filter(x=>x!=null),sts=last.map(p=>p.soilT).filter(x=>x!=null);
 const Tmax=temps.length?Math.max(...temps):null,Tmin=temps.length?Math.min(...temps):null,Tmean=temps.length?(Tmax+Tmin)/2:null;
 const RHmin=rhs.length?Math.min(...rhs):null;
 const Ra=extraRad(end);
 const ET0=temps.length?0.0023*Ra*(Tmean+17.8)*Math.sqrt(Math.max(0,Tmax-Tmin)):null;
 const ETc=ET0!=null?ET0*th.Kc:null;
 const lastOk=[...R].reverse().find(p=>p.q==='OK');
 const v=lastOk?lastOk.vwc:null;
 const TAW=1000*(z.fc-z.wp)*z.root,RAW=z.p*TAW;
 const Dr=v!=null?clamp(1000*(z.fc-v)*z.root,0,TAW):null;
 const Ks=Dr==null?null:Dr<=RAW?1:(TAW-Dr)/(TAW-RAW);
 const heat=Tmax!=null?clamp((Tmax-th.T_low)/(th.T_high-th.T_low)):0;
 const dry=RHmin!=null?clamp((th.RH_low-RHmin)/(th.RH_low-th.RH_crit)):0;
 const dep=Dr!=null?clamp(Dr/TAW):0;
 const stx=sts.length?clamp((Math.max(...sts)-30)/8):0;
 const ESI=0.30*heat+0.25*dry+0.30*dep+0.15*stx;
 const faults=last.filter(p=>p.q!=='OK').length;
 const quality=last.length?ok.length/last.length:0;
 const excess=v!=null&&v>z.fc+0.02;
 const dmax={};R.forEach(p=>{if(p.q!=='OK'||p.ts<=end-7*864e5)return;const k=Math.floor((end-p.ts)/864e5);const d=1000*(z.fc-p.vwc)*z.root;dmax[k]=Math.max(dmax[k]??-1e9,d)});
 const dk=Object.values(dmax);const irreg=dk.length?dk.filter(d=>d>RAW).length/dk.length:null;
 const rain24=last.reduce((s,p)=>s+(p.rain||0),0);
 return {end,Tmax,Tmin,Tmean,RHmin,Ra:r2(Ra),ET0,ETc,v,TAW,RAW,Dr,Ks,ESI,parts:{heat,dry,dep,stx},faults,quality,excess,irreg,rain24,vRAW:z.fc-RAW/(1000*z.root),lastOkTs:lastOk?lastOk.ts:null};
}
function photoStats(z){
 const cut=Date.now()-14*864e5;const ph=z.photos.filter(p=>p.ts>cut&&p.quality==='OK');
 const lbl=p=>p.expertCls||p.cls;
 return {n:ph.length,abn:ph.filter(p=>ABN.includes(lbl(p))).length,pendingReview:z.photos.filter(p=>p.review&&!p.expertCls&&!p.retakeReq).length};
}
function risk(z,a){
 const th=S.thr.vals,ps=photoStats(z),d=z.drops[z.drops.length-1];
 const f=[
  {k:'f_esi',v:a?a.ESI:null,w:th.w_esi,src:'PRED'},
  {k:'f_irr',v:a?a.irreg:null,w:th.w_irr,src:'SIM'},
  {k:'f_img',v:ps.n?ps.abn/ps.n:null,w:th.w_img,src:'IMG'},
  {k:'f_drop',v:d?clamp(d.rate/th.drop_guard):null,w:th.w_drop,src:'USER'},
  {k:'f_stage',v:STAGE_SENS[z.stage],w:th.w_stage,src:'USER'}];
 const tot=f.reduce((s,x)=>s+x.w,0)||1,av=f.filter(x=>x.v!=null),ws=av.reduce((s,x)=>s+x.w,0);
 let score=ws?100*av.reduce((s,x)=>s+x.w*x.v,0)/ws:0;
 f.forEach(x=>x.c=x.v==null?0:100*x.w*x.v/(ws||1));
 const guard=[];
 if(d&&d.rate>=th.drop_guard&&score<50){score=50;guard.push(`Fruit drop ≥ ${th.drop_guard}% → at least HIGH`)}
 if(a&&a.Ks!=null&&a.Ks<0.5&&STAGE_SENS[z.stage]>=0.7&&score<25){score=25;guard.push('Water stress in sensitive stage → at least MODERATE')}
 if(d&&d.rate>=2*th.drop_guard&&a&&a.ESI>0.6&&score<75){score=75;guard.push('Very high drop with high stress → CRITICAL')}
 const comp=ws/tot,dq=a?a.quality:0;
 const band=5+(1-comp)*20+(dq<0.8?6:0);
 const cat=score>=75?'CRITICAL':score>=50?'HIGH':score>=25?'MODERATE':'LOW';
 return {score:r1(score),cat,band:r1(band),lo:r1(Math.max(0,score-band)),hi:r1(Math.min(100,score+band)),unc:band<=9?'LOW':band<=15?'MEDIUM':'HIGH',comp,dq,factors:f,guard,ver:S.thr.version,at:Date.now()};
}

/* ---------------------------- recommendation engine ---------------------------- */
function irrPlan(z,netReq){const th=S.thr.vals;const net=Math.max(1,Math.round(Math.min(netReq,th.max_net)));const gross=net/z.ea;const vol=gross/1000*z.area_ha*1e4*z.fw;return {net,gross:r1(gross),vol:Math.round(vol),hrs:r1(vol/z.flow)}}
function evaluate(z){
 const a=analyse(z),rk=risk(z,a),th=S.thr.vals;z.a=a;z.risk=rk;
 S.riskHist.push({zone:z.id,score:rk.score,cat:rk.cat,ver:rk.ver,at:rk.at});if(S.riskHist.length>400)S.riskHist.splice(0,S.riskHist.length-400);
 const want={},ps=photoStats(z);
 const E=(k,val,src)=>({k,val,src});
 const riskE=E('ev_risk',`${rk.cat} ${rk.score}`,'PRED');
 if(a&&a.Dr!=null&&a.Dr>a.RAW&&!a.excess){
  if(z.forecastRain) want.R08={p:3,evidence:[E('ev_dep',`${Math.round(a.Dr)} > ${Math.round(a.RAW)} mm`,'SIM'),E('ev_rain','yes','SIM')],verify:'v_soil'};
  else want.R01={p:(rk.cat==='HIGH'||rk.cat==='CRITICAL')?1:2,plan:irrPlan(z,a.Dr),evidence:[E('ev_dep',`${Math.round(a.Dr)} mm > RAW ${Math.round(a.RAW)} mm`,'SIM'),E('ev_vwc',`${a.v} m³/m³`,'SIM'),E('ev_esi',r2(a.ESI),'PRED'),...(z.drops.length?[E('ev_drop',z.drops[z.drops.length-1].rate+' %','USER')]:[]),riskE],verify:'v_soil'};
 }
 if(a&&a.excess) want.R02={p:2,evidence:[E('ev_wet',`${a.v} > ${z.fc} m³/m³`,'SIM')],verify:'v_drain'};
 if(a&&a.ESI>=0.6) want.R03={p:2,evidence:[E('ev_esi',r2(a.ESI),'PRED'),E('T max',a.Tmax!=null?r1(a.Tmax)+' °C':'—','SIM'),E('RH min',a.RHmin!=null?a.RHmin+' %':'—','SIM')],verify:'v_esi'};
 if(ps.pendingReview>0) want.R04={p:2,expert:true,evidence:[E('ev_photo',ps.pendingReview,'IMG')],verify:'v_expert'};
 const ld=z.drops[z.drops.length-1];
 if(rk.cat!=='LOW'&&(!ld||Date.now()-ld.at>5*864e5)) want.R05={p:3,evidence:[riskE],verify:'v_recount'};
 if(a&&a.faults>0) want.R06={p:2,evidence:[E('ev_fault',`${a.faults}/24 h`,'SIM')],verify:'v_sensor'};
 const unl=z.labs.filter(l=>!l.reviewed).length;
 if(unl) want.R07={p:3,expert:true,evidence:[E('ev_lab',unl,'LAB')],verify:'v_expert'};
 // update / create
 S.recs.filter(r=>r.zone===z.id&&r.rule!=='MAN').forEach(r=>{
  const w=want[r.rule];
  if(OPEN_STATES.includes(r.state)){
   if(w){if(r.state!=='EXECUTED'){r.evidence=w.evidence;r.risk={score:rk.score,cat:rk.cat,unc:rk.unc};if(w.plan&&r.state==='ALERTED')r.plan=w.plan}delete want[r.rule]}
   else if(r.state==='ALERTED'||r.state==='DEFERRED'){setState(r,'CANCELLED','system','condition cleared on re-check');S.ints.filter(i=>i.rec===r.id&&i.status==='READY').forEach(i=>i.status='ABORTED')}
   else if(r.state==='EXECUTED'&&r.rule!=='R01'){setState(r,'VERIFIED','system','condition no longer present')}
   else if(r.state==='APPROVED'&&r.rule==='R01'&&!w){/* keep: farmer approved; safety checks decide */}
  }
 });
 for(const rule in want){const w=want[rule];S.seq.rec++;
  const rec={id:'REC-'+S.seq.rec,zone:z.id,rule,p:w.p,state:'DETECTED',created:Date.now(),plan:w.plan||null,evidence:w.evidence,expert:!!w.expert,verify:w.verify,risk:{score:rk.score,cat:rk.cat,unc:rk.unc},hist:[],ver:S.thr.version};
  S.recs.push(rec);setState(rec,'ANALYSED','system');setState(rec,'ALERTED','system',`threshold v${S.thr.version}`);
  if(rule==='R01'&&z.forecastRain===false){/* noop */}
 }
 // irrigation recs approved but rain now expected -> leave, safety check will block
}
function setState(r,to,by,note){const from=r.state;r.state=to;r.hist.push({to,at:Date.now(),by,note:note||''});logE(by,'RECOMMENDATION',r.id,from,to,note)}
function reevaluate(){S.zones.forEach(evaluate);if(S.recs.length>300){const keep=S.recs.filter(r=>OPEN_STATES.includes(r.state));const old=S.recs.filter(r=>!OPEN_STATES.includes(r.state)).slice(-200);S.recs=[...old,...keep]}}
function openRecs(){return S.recs.filter(r=>OPEN_STATES.includes(r.state)).sort((a,b)=>a.p-b.p||(b.risk?.score||0)-(a.risk?.score||0))}
function recTitle(r){return t('r_'+r.rule,{z:r.zone})}

/* ---------------------------- observations ---------------------------- */
function addDrop(z,{tagged,fallen,from,to},by,silent){
 S.seq.drop++;const rate=r1(100*fallen/tagged);
 const d={id:'DROP-'+S.seq.drop,tagged,fallen,from,to,rate,stage:z.stage,at:to||Date.now(),by,src:'USER'};persist(d,'fruit_drop');z.drops.push(d);if(z.drops.length>40)z.drops.shift();
 if(!silent)logE(by,'FRUIT_DROP',d.id,'','CREATED',`${z.id} ${rate}%`);
 // verify open recount recs
 S.recs.filter(r=>r.zone===z.id&&r.rule==='R05'&&OPEN_STATES.includes(r.state)&&r.state!=='ALERTED'&&r.state!=='DEFERRED').forEach(r=>setState(r,'VERIFIED',by,'new count entered'));
 S.recs.filter(r=>r.zone===z.id&&r.rule==='R05'&&(r.state==='ALERTED'||r.state==='DEFERRED')).forEach(r=>{setState(r,'APPROVED',by,'count entered');setState(r,'EXECUTED',by);setState(r,'VERIFIED',by,'new count entered')});

}

/* ---------------------------- image screening (OpenCV-style fallback) ---------------------------- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return [h,mx?d/mx:0,mx]}
function screenImage(img,part){
 const ow=img.naturalWidth,oh=img.naturalHeight,sc=Math.min(1,256/Math.max(ow,oh)),w=Math.max(8,Math.round(ow*sc)),h=Math.max(8,Math.round(oh*sc));
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,n=w*h,G=new Float32Array(n);
 let sum=0,green=0,yellow=0,brown=0,orange=0,dark=0;
 for(let i=0;i<n;i++){const R=d[i*4],Gr=d[i*4+1],B=d[i*4+2];const gy=.299*R+.587*Gr+.114*B;G[i]=gy;sum+=gy;
  const [hh,s,v]=rgb2hsv(R,Gr,B);
  if(s>0.22&&v>0.18){if(hh>=70&&hh<=170)green++;else if(hh>=42&&hh<70&&v>0.45)yellow++;else if(hh>=8&&hh<42){if(v<0.58)brown++;else if(s>0.45)orange++;else yellow++}}
  else if(v<0.2) dark++;}
 const mean=sum/n;let ls=0,ls2=0,lc=0;
 for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const i=y*w+xx;const Lp=4*G[i]-G[i-1]-G[i+1]-G[i-w]-G[i+w];ls+=Lp;ls2+=Lp*Lp;lc++}
 const lapVar=lc?ls2/lc-(ls/lc)**2:0;
 let quality='OK';
 if(Math.min(ow,oh)<224)quality='SMALL';else if(mean<45)quality='DARK';else if(mean>222)quality='BRIGHT';else if(lapVar<40)quality='BLUR';
 const plant=green+yellow+brown+orange,pf=plant/n;
 const S0={healthy_looking:0,yellowing_like:0,lesion_spot_like:0,pest_damage_like:0,fruit_blemish_like:0,unknown:0.2};
 if(pf<0.12){S0.unknown=2}else if(part==='fruit'){
  const bf=(brown+Math.min(dark,brown*2))/plant;S0.healthy_looking=1.2-6*bf;S0.fruit_blemish_like=7*bf;S0.lesion_spot_like=1.5*bf;S0.yellowing_like=0.6*(green/plant);
 }else{
  const base=green+yellow+brown||1,yf=yellow/base,bf=brown/base,df=Math.min(dark/base,0.3);
  S0.healthy_looking=1.2-4*yf-6*bf-4*df;S0.yellowing_like=5*yf;S0.lesion_spot_like=10*bf;S0.pest_damage_like=5*df;S0.fruit_blemish_like=-1;
 }
 if(pf<0.25)S0.unknown+=0.6;
 const ex=CLASSES.map(k=>Math.exp(3*S0[k])),se=ex.reduce((a,b)=>a+b,0);
 const probs=CLASSES.map((k,i)=>({k,p:ex[i]/se})).sort((a,b)=>b.p-a.p);
 return {quality,mean:Math.round(mean),lapVar:Math.round(lapVar),pf:r2(pf),probs:probs.slice(0,3).map(p=>({k:p.k,p:r2(p.p)})),cls:probs[0].k,conf:r2(probs[0].p),margin:r2(probs[0].p-probs[1].p)};
}
function toJpeg(img,max,q){const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function demoImage(kind){
 const c=document.createElement('canvas');c.width=480;c.height=360;const x=c.getContext('2d');const r=rng(kind.length*97+Date.now()%100000);
 x.fillStyle='#e8e3d8';x.fillRect(0,0,480,360);
 if(kind==='fruit'){
  const g=x.createRadialGradient(205,150,20,240,180,140);g.addColorStop(0,'#ffb24d');g.addColorStop(1,'#e2770f');x.fillStyle=g;x.beginPath();x.arc(240,180,130,0,7);x.fill();
  x.fillStyle='#3d8a3a';x.beginPath();x.ellipse(250,52,30,12,-0.4,0,7);x.fill();
  x.fillStyle='#5e3f1c';for(let i=0;i<9;i++){x.beginPath();x.arc(170+r()*150,120+r()*130,10+r()*16,0,7);x.fill()}
 }else{
  x.save();x.translate(240,180);x.rotate(-0.35);
  const g=x.createLinearGradient(-200,0,200,0);g.addColorStop(0,'#2f7d34');g.addColorStop(1,'#46a043');x.fillStyle=g;
  x.beginPath();x.moveTo(-200,0);x.quadraticCurveTo(0,-150,200,0);x.quadraticCurveTo(0,150,-200,0);x.fill();
  if(kind==='yellow'){x.save();x.clip();x.fillStyle='rgba(222,200,48,.95)';x.beginPath();x.ellipse(110,-10,62,48,0.2,0,7);x.fill();x.restore()}
  x.strokeStyle='#245f28';x.lineWidth=3;x.beginPath();x.moveTo(-195,0);x.lineTo(195,0);x.stroke();
  for(let i=-150;i<170;i+=40){x.lineWidth=1.6;x.beginPath();x.moveTo(i,0);x.lineTo(i+35,-55);x.moveTo(i,0);x.lineTo(i+35,55);x.stroke()}
  if(kind==='spots'){x.fillStyle='#6a4a20';for(let i=0;i<26;i++){x.beginPath();x.arc(-150+r()*300,-55+r()*110,7+r()*13,0,7);x.fill()}}
  x.restore();
 }
 const im=x.getImageData(0,0,480,360),dd=im.data;for(let i=0;i<dd.length;i+=4){const nz=(r()-.5)*28;dd[i]=clamp(dd[i]+nz,0,255);dd[i+1]=clamp(dd[i+1]+nz,0,255);dd[i+2]=clamp(dd[i+2]+nz,0,255)}x.putImageData(im,0,0);
 if(kind==='blur'){const s=document.createElement('canvas');s.width=36;s.height=27;s.getContext('2d').drawImage(c,0,0,36,27);x.imageSmoothingEnabled=true;x.drawImage(s,0,0,480,360)}
 return c.toDataURL('image/jpeg',.9);
}

/* ---------------------------- auth ---------------------------- */
let fails=0,lockUntil=0;
let SESSION;
function sess(){if(SESSION===undefined){try{SESSION=JSON.parse(store.get(SKEY))}catch(e){SESSION=null}}
 if(!SESSION)return null;if(SESSION.exp<Date.now()){SESSION=null;store.del(SKEY);V.flash=t('session_expired');return null}return SESSION}
function startSession(u){SESSION={uid:u.id,exp:Date.now()+8*36e5,token:uuid()};store.set(SKEY,JSON.stringify(SESSION))}
function endSession(){SESSION=null;store.del(SKEY)}
/* keeps the account table healthy: demo accounts always present & valid, identifiers normalised */
function ensureUsers(){if(!Array.isArray(S.users))S.users=[];
 S.users.forEach(u=>{u.identifier=normId(String(u.identifier||'').replace('@santra.demo','@bahar.demo'));u.failed=u.failed||0;u.lockUntil=u.lockUntil||0});
 DEMO_USERS.forEach(d=>{let u=S.users.find(x=>x.id===d.id)||S.users.find(x=>x.identifier===d.identifier);
  if(!u){S.users.push(mkUser(d.name,d.identifier,d.pw,d.role,d.id));return}
  u.identifier=d.identifier;if(!u.role)u.role=d.role;if(!checkPw(u,d.pw))setPw(u,d.pw)})}
function me(){const s=sess();return s&&S.users.find(u=>u.id===s.uid)}
function role(){const u=me();return u?u.role:null}
function can(p){const r=role();return !!r&&(PERM[p]||[]).includes(r)}
function canSee(scr){const a=ACCESS[scr];const r=role();return a==='*'||(a||[]).includes(r)}

let theme=store.get(TKEY)||(darkQ&&darkQ.matches?'dark':'light');
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',theme==='dark'?'#11171c':'#f7f5f0')}
function themeSwitch(){const d=theme==='dark';return `<button class="tgl" role="switch" aria-checked="${d}" aria-label="${t('dark_mode')}" title="${d?t('light_mode'):t('dark_mode')}" onclick="A.theme()"><span class="s l">${I.sun}</span><span class="s r">${I.moon}</span><span class="k">${d?I.moon:I.sun}</span></button>`}

function gauge(score,cat,w=130){const a=Math.PI*(1-clamp(score/100));const x=60+48*Math.cos(a),y=58-48*Math.sin(a),col=CAT_COL[cat];
 return `<svg viewBox="0 0 120 68" width="${w}" aria-label="risk ${score}"><path d="M12 58 A48 48 0 0 1 108 58" fill="none" style="stroke:var(--track)" stroke-width="11" stroke-linecap="round"/>${score>0.5?`<path d="M12 58 A48 48 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"/>`:''}<text x="60" y="55" text-anchor="middle" font-size="22" font-weight="800" fill="${col}">${Math.round(score)}</text></svg>`}
function chart(series,o={}){
 const W=640,H=o.h||180,pl=42,pr=10,pt=10,pb=22,ts=o.ts||[];
 const n=Math.max(1,...series.map(s=>s.vals.length));
 let all=series.flatMap(s=>s.vals).filter(v=>v!=null);(o.lines||[]).forEach(l=>all.push(l.v));if(!all.length)all=[0,1];
 let lo=o.ymin??Math.min(...all),hi=o.ymax??Math.max(...all);if(hi-lo<1e-6){hi+=1;lo-=1}const pad=(hi-lo)*.08;if(o.ymin==null)lo-=pad;if(o.ymax==null)hi+=pad;
 const X=i=>pl+(W-pl-pr)*i/Math.max(1,n-1),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
 let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl-5}" y="${Y(v)+4}" class="ax" text-anchor="end">${fmtN(v)}</text>`}
 if(o.bars){const bm=Math.max(1,...o.bars.vals.map(v=>v||0));o.bars.vals.forEach((v,i)=>{if(v>0){const bh=(H-pt-pb)*0.45*v/bm;g+=`<rect x="${X(i)-2}" y="${H-pb-bh}" width="4" height="${bh}" fill="${o.bars.color}" opacity=".7"><title>${v} mm</title></rect>`}})}
 (o.lines||[]).forEach(l=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${l.color}" stroke-dasharray="6 5" stroke-width="1.6"/><text x="${W-pr-4}" y="${Y(l.v)-4}" text-anchor="end" class="ax" style="fill:${l.color};font-weight:700">${esc(l.label)}</text>`);
 series.forEach(s=>{let dd='',pen=false;s.vals.forEach((v,i)=>{if(v==null){pen=false;return}dd+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});g+=`<path d="${dd}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
  if(s.flags)s.flags.forEach((f,i)=>{if(f&&f!=='OK'&&s.vals[i]!=null)g+=`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4" fill="#c8372d"><title>${f} ${s.vals[i]}</title></circle>`})});
 if(ts.length){for(let i=0;i<ts.length;i+=Math.max(24,Math.ceil(ts.length/7/24)*24)){g+=`<text x="${X(i)}" y="${H-5}" class="ax" text-anchor="start">${fmtD(ts[i])}</text>`}}
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}

  {k:'rain',ok:!z.forecastRain,d:z.forecastRain?t('ev_rain'):''},{k:'sensors',ok:!!a&&a.faults===0,d:a?`${a.faults} flags`:''},{k:'estop',ok:!S.estop}]}

  if(k==='ints'){name='irrigation.csv';data=csv([['id','zone','mode','net_mm','volume_m3','hours','status','verification','ratio','rating','source'],...S.ints.map(i=>[i.id,i.zone,i.mode,i.plan.net,i.plan.vol,i.plan.hrs,i.status,i.ver?.status,i.ver?.ratio,i.rating,'SIMULATED'])])}
  if(k==='json'){name='bahar_backup.json';type='application/json';data=JSON.stringify({...S,exportedAt:new Date().toISOString(),note:'All sensor data simulated'},null,1)}
  const b=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);logE(me().name,'EXPORT',name,'','DOWNLOADED');save()},
 restore(inp){const f=inp.files[0];inp.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.v!==1||!Array.isArray(d.zones)||!Array.isArray(d.users))throw 0;delete d.exportedAt;delete d.note;V.pendingRestore=d;
  modal(`<h2>${I.refresh} ${t('restore')}</h2><p>${t('confirm_restore')}</p><div class="row"><button class="btn" onclick="A.doRestore()">${t('restore')}</button><button class="btn o" onclick="A.close()">${t('cancel')}</button></div>`)}catch(e){toast('Not a valid backup file')}};rd.readAsText(f)},
 doRestore(){const d=V.pendingRestore;if(!d)return;V.pendingRestore=null;const who=me()?.name||'?';S=d;ensureUsers();if(!me())endSession();logE(who,'BACKUP','restore','','RESTORED');save();A.close();render();toast(`${I.check} ${t('saved')}`)},
 reset(){if(!can('reset'))return;modal(`<h2>${I.trash} ${t('reset')}</h2><p>${t('confirm_reset')}</p><div class="row"><button class="btn r" onclick="A.doReset()">${t('reset')}</button><button class="btn o" onclick="A.close()">${t('cancel')}</button></div>`)},
 doReset(){S=seedState();ensureUsers();if(!me())endSession();save();A.close();render()},
 saveOrchard(){if(!can('edit_orchard'))return toast(`${I.ban} Not permitted for this role`);const e=document.getElementById('oErr');const name=document.getElementById('o_name').value.trim(),area=+document.getElementById('o_area').value,trees=+document.getElementById('o_trees').value;
  if(!name||name.length>80)return e.textContent='name 1–80';if(!(area>=0.01&&area<=500))return e.textContent='area 0.01–500 ha';if(!(Number.isInteger(trees)&&trees>=1&&trees<=100000))return e.textContent='trees 1–100000';
  Object.assign(S.orchard,{name,area,trees,soil:document.getElementById('o_soil').value,irrigation:document.getElementById('o_irr').value});logE(me().name,'ORCHARD',name,'','UPDATED');save();render();toast(`${I.check} ${t('saved')}`)},
 saveZone(){if(!can('edit_orchard'))return toast(`${I.ban} Not permitted for this role`);const e=document.getElementById('zErr'),g=id=>+document.getElementById(id).value,z=Z(V.zone);
  const v={trees:g('z_trees'),area_ha:g('z_area'),fc:g('z_fc'),wp:g('z_wp'),root:g('z_root'),p:g('z_p'),ea:g('z_ea'),maxH:g('z_max'),flow:g('z_flow'),fw:g('z_fw')};
  const rules=[['trees',1,100000],['area_ha',0.01,500],['fc',0.1,0.6],['wp',0.02,0.4],['root',0.2,2],['p',0.2,0.8],['ea',0.5,1],['maxH',0.5,24],['flow',1,500],['fw',0.1,1]];
  for(const [k,lo,hi] of rules)if(!(isFinite(v[k])&&v[k]>=lo&&v[k]<=hi))return e.textContent=`${I.alert} ${k}: ${lo}–${hi}`;
  if(v.wp>=v.fc)return e.textContent='θWP must be below θFC';if(!Number.isInteger(v.trees))return e.textContent='trees integer';
  Object.assign(z,v);flagQuality(z.readings);logE(me().name,'ZONE',z.id,'','UPDATED');reevaluate();save();render();toast(`${I.check} ${t('saved')}`)},
 setStage(s){if(!can('edit_orchard'))return;const z=Z(V.zone);if(z.stage===s)return;logE(me().name,'ZONE',z.id,z.stage,s,'crop stage');z.stage=s;z.stageHist.push({stage:s,at:Date.now(),by:me().name});reevaluate();save();render()},
 addZone(){if(!can('edit_orchard'))return;const n=S.zones.length+1;if(n>12)return toast('max 12 zones in MVP');const z=mkZone('Z'+n,n,50,'fruit_set',0.3);S.zones.push(z);simulate(z,'NORMAL',n*13,7,'none');logE(me().name,'ZONE',z.id,'','CREATED','defaults unvalidated');V.zone=z.id;reevaluate();save();render()},
 importCsv(txt){const out=document.getElementById('csvOut');const text=txt??document.getElementById('csv').value;const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let ok=0;const errs=[];
  lines.forEach((ln,i)=>{const c=ln.split(',').map(s=>s.trim());if(i===0&&/tree_id/i.test(c[0]))return;const [id,zone,variety,age]=c;
   if(!id)return errs.push(`row ${i+1}: missing tree_id`);if(!Z(zone))return errs.push(`row ${i+1}: unknown zone "${zone}"`);const ag=+age;if(age&&!(ag>=0&&ag<=80))return errs.push(`row ${i+1}: age 0–80`);
   if(S.trees.some(t=>t.id===id))return errs.push(`row ${i+1}: duplicate ${id}`);S.trees.push({id,zone,variety:variety||'Nagpur Mandarin',age:age?ag:null});ok++});
  logE(me().name,'TREES','import','',`${ok} added`,`${errs.length} rejected`);save();render();const o2=document.getElementById('csvOut');if(o2)o2.innerHTML=`${I.check} ${ok} · ${I.ban} ${errs.length}<br>${errs.slice(0,10).map(esc).join('<br>')}`},
 csvFile(inp){const f=inp.files[0];inp.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>A.importCsv(rd.result);rd.readAsText(f)},
};

/* ---------------------------- boot ---------------------------- */
try{S=JSON.parse(store.get(KEY))}catch(e){S=null}
if(!S||S.v!==1||!Array.isArray(S.zones)){S=seedState()}
ensureUsers();save();
document.documentElement.lang=lang;applyTheme();
if(S.ints.some(i=>i.status==='RUNNING'))A.startTimer();
window.addEventListener('online',()=>{syncNow();render()});window.addEventListener('offline',render);
setInterval(()=>{if(SESSION&&!sess())render()},60000);
render();
</script>
